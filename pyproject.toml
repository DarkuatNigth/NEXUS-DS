[tool.pytest.ini_options]
pythonpath = ["services/api"]
addopts = "--cov=app --cov-report=term-missing"

[project]
name = "nubepractica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.34.84",
    "fastapi==0.111.0",
    "httpx==0.27.0",
    "joblib==1.4.0",
    "moto[s3,ssm]==5.0.9",
    "openpyxl==3.1.2",
    "pandas==2.2.2",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "scikit-learn==1.4.2",
    "uvicorn[standard]==0.29.0",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.4",
]
